<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISC 及大五人格测评</title>

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ 关键：让 script.js 在 DOM 完整后再执行 -->
  <script src="script.js" defer></script>
</head>

<body>
  <!-- 公司 Logo -->
  <div id="logo">
    <img src="images/logo.png" alt="公司 Logo">
  </div>

  <h1>DISC 及大五人格测评</h1>
  <p>请选择最符合你的选项</p>

  <!-- 用户信息 -->
  <div id="userInfo" class="box">
    <h2>填写您的信息</h2>

    <!-- ✅ 防止默认提交跳转/刷新 -->
    <form id="userForm" autocomplete="off" action="javascript:void(0)">
      <div class="form-group">
        <label for="name">姓名：</label>
        <input type="text" id="name" required placeholder="请输入您的姓名">
      </div>

      <div class="form-group">
        <label for="department">部门：</label>
        <input type="text" id="department" required placeholder="请输入您的部门">
      </div>

      <div class="form-group">
        <label for="position">岗位：</label>
        <input type="text" id="position" required placeholder="请输入您的岗位">
      </div>

      <button id="startBtn" type="submit" class="navBtn primary">开始测评</button>
    </form>
  </div>

  <!-- 测评内容区，初始隐藏 -->
  <div id="questionBox" style="display:none;">
    <div class="box">
      <h2 id="question"></h2>

      <div class="options" id="options"></div>
      <p id="selectedText" class="selectedText">你还没选择</p>

      <div class="nav">
        <button id="prevBtn" class="navBtn" type="button">上一题</button>
        <button id="nextBtn" class="navBtn primary" type="button">下一题</button>
      </div>
    </div>

    <p id="progressText" class="progressText"></p>
    <div class="progressWrap">
      <div class="progressBar" id="progressBar"></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="box" id="resultBox" style="display:none;">
    <h2>测评结果</h2>

    <div id="resultLayout">
      <div class="resultCard discCard">
        <div class="cardHeader">DISC 结果</div>
        <div id="discText" class="cardBody"></div>
      </div>

      <div class="resultCard big5Card">
        <div class="cardHeader">大五人格结果</div>
        <div id="big5Text" class="cardBody"></div>
      </div>
    </div>

    <div class="chartWrap">
      <canvas id="resultChart" width="400" height="200"></canvas>
    </div>

    <div class="chartWrap">
      <canvas id="big5RadarChart" width="400" height="300"></canvas>
    </div>

    <ul id="scoreList"></ul>

    <button id="uploadBtn" class="navBtn" type="button" onclick="uploadToCloud()">
      提交结果到后台
    </button>

    <button id="restartBtn" class="navBtn primary" type="button" style="margin-top:14px;">
      再测一次
    </button>
  </div>

  <!-- ✅ 备用：如果 submit 监听没绑定，用按钮点击也能启动（不改 script.js） -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("userForm");
      const btn = document.getElementById("startBtn");

      // 如果 script.js 没绑定 submit，这里兜底：阻止刷新
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
        });
      }

      // 这个兜底不会替代你的逻辑，只是避免“卡住”
      // 真正切换题目仍由 script.js 的 renderQuestion / 绑定逻辑控制
      if (btn) {
        btn.addEventListener("click", () => {
          // 仅用于检查：点了至少不会刷新
          // 如果你仍卡住，说明 script.js 没跑或报错
          console.log("✅ startBtn clicked");
        });
      }
    });
  </script>
</body>
</html>
