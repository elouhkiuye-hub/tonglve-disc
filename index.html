<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISC 测评</title>
  <link rel="stylesheet" href="style.css">

  <!-- 先加载第三方库，再加载你自己的脚本 -->
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <!-- 公司 Logo -->
  <div id="logo" >
    <img src="images/logo.png" alt="公司 Logo" style="width: 200px; height: auto;">
  </div>

  <h1>职业性格测评</h1>
  <p>请选择最符合你的选项</p>

  <!-- 用户信息 -->
  <div id="userInfo" class="box">
    <h2>填写您的信息</h2>
    <form id="userForm" autocomplete="off">
      <div class="form-group">
        <label for="name">姓名：</label>
        <input type="text" id="name" required placeholder="请输入您的姓名">
      </div>
      <div class="form-group">
        <label for="department">部门：</label>
        <input type="text" id="department" required placeholder="请输入您的部门">
      </div>
      <div class="form-group">
        <label for="position">岗位：</label>
        <input type="text" id="position" required placeholder="请输入您的岗位">
      </div>

      <!-- type=submit 会触发 script.js 里的 submit 监听 -->
      <button type="submit" class="navBtn primary">开始测评</button>
    </form>
  </div>

  <!-- 测评内容区，初始隐藏 -->
  <div id="questionBox" style="display:none;">
    <div class="box">
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <p id="selectedText" class="selectedText">你还没选择</p>

      <div class="nav">
        <!-- 这里明确 type=button，避免按钮在某些情况下被当成提交按钮 -->
        <button id="prevBtn" class="navBtn" type="button">上一题</button>
        <button id="nextBtn" class="navBtn primary" type="button">下一题</button>
      </div>
    </div>

    <p id="progressText" class="progressText"></p>
    <div class="progressWrap">
      <div class="progressBar" id="progressBar"></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="box" id="resultBox" style="display:none;">
    <h2>你的 DISC 结果</h2>
    <div id="resultLayout">
  <div class="resultCard discCard">
    <div class="cardHeader">DISC 结果</div>
    <div id="discText" class="cardBody"></div>
  </div>

  <div class="resultCard big5Card">
    <div class="cardHeader">大五人格结果</div>
    <div id="big5Text" class="cardBody"></div>
  </div>
</div>

    <!-- 图表 Canvas -->
    <canvas id="resultChart" width="400" height="200"></canvas>
    <canvas id="big5RadarChart" width="400" height="300"></canvas>

    <ul id="scoreList"></ul>

    <!-- 上传按钮：明确 type=button，避免任何“意外提交表单” -->
    <button id="uploadBtn" class="navBtn" type="button" onclick="uploadToCloud()">
      提交结果到后台
    </button>

    <button id="restartBtn" class="navBtn primary" type="button" style="margin-top:14px;">
      再测一次
    </button>
  </div>

  <!-- 最后加载你自己的脚本（确保 DOM 都已生成） -->
  <script src="script.js"></script>

  <!-- ✅ Supabase 配置 + 上传函数（放在 script.js 后面，确保能覆盖同名函数） -->
  <script>
    // === 1) Supabase 配置（前端用 Publishable key） ===
    const SUPABASE_URL = "https://ufqwcdftdgfnpxgalvau.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vca15z0QMvN6nkQTFd90wQ_FuCFHKWQ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // === 2) 从分数对象计算主类型/次类型 ===
    function getMainAndSecondaryType(scores) {
      const entries = Object.entries(scores || {});
      entries.sort((a, b) => (b[1] ?? 0) - (a[1] ?? 0));

      const mainType = entries[0]?.[0] ?? "";
      const secondaryType = entries[1]?.[0] ?? "";
      const typeCombo = (mainType && secondaryType) ? (mainType + secondaryType) : (mainType || "");

      return { mainType, secondaryType, typeCombo };
    }

    // === 3) 上传到 Supabase ===
    async function uploadToCloud() {
      try {
        const name = document.getElementById("name")?.value?.trim();
        const department = document.getElementById("department")?.value?.trim();
        const position = document.getElementById("position")?.value?.trim();

        if (!name || !department || !position) {
          alert("请先填写姓名 / 部门 / 岗位，再提交。");
          return;
        }

        // ✅ 这里是你项目里唯一可能需要改的一行：
        // 你算出来的分数对象请放到 window.scores，例如：window.scores = { D: 12, I: 8, S: 5, C: 9 }
        const scores = window.scores;

        if (!scores || typeof scores !== "object") {
          console.error("window.scores 不存在或不是对象：", scores);
          alert("找不到分数数据（window.scores）。请先完成测评并显示结果后再提交。");
          return;
        }

        // 读取页面显示的主类型（有些项目会在这里显示 “主类型：D” 这种文字）
        const mainTypeText = document.getElementById("mainType")?.textContent?.trim() || "";

        // 用分数计算主/次（更可靠）
        const { mainType, secondaryType } = getMainAndSecondaryType(scores);

        // 如果页面里 mainTypeText 有值，就优先用页面的（避免你页面有自定义逻辑）
        // 否则用计算结果
        const finalMainType = mainTypeText || mainType;

        const payload = {
          name,
          department,
          position,
          d_score: Number(scores.D ?? 0),
          i_score: Number(scores.I ?? 0),
          s_score: Number(scores.S ?? 0),
          c_score: Number(scores.C ?? 0),
          main_type: finalMainType,
          secondary_type: secondaryType,
          scores: scores
        };

        const { error } = await supabaseClient
          .from("disc_results")
          .insert([payload]);

        if (error) {
          console.error("Supabase insert error:", error);
          alert("提交失败：" + (error.message || "未知错误"));
          return;
        }

        alert("提交成功 ✅");
      } catch (e) {
        console.error("uploadToCloud exception:", e);
        alert("提交异常：" + (e.message || e));
      }
    }
  </script>
</body>

</html>
